name: nuxiva

services:
  nuxiva-core:
    image: nuxiva-core:local
    build:
      context: ..
      dockerfile: docker/core/Dockerfile
      args:
        NUXIVA_SRC_HASH: ${NUXIVA_SRC_HASH:-dev}
    container_name: nuxiva-core
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: /etc/nuxiva/nuxiva.env
        required: false
    environment:
      NUXIVA_ENV: production
      NUXIVA_HOST: 0.0.0.0
      NUXIVA_PORT: "8443"
      OLLAMA_BASE_URL: ${NUXIVA_OLLAMA_URL:-http://127.0.0.1:11434}
      QDRANT_HOST: 127.0.0.1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../data/db:/app/data/db
      - ../data/certs:/app/data/certs
      - ../data/models:/app/data/models
      - /run/nuxiva/sandbox:/run/nuxiva/sandbox
      - /var/lib/nuxiva/brain:/run/nuxiva/brain:ro
    depends_on:
      - nuxiva-qdrant

  nuxiva-qdrant:
    image: qdrant/qdrant:latest
    container_name: nuxiva-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ../data/qdrant:/qdrant/storage

  nuxiva-inference:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/inference/Dockerfile
    image: nuxiva-inference:local
    container_name: nuxiva-inference
    restart: unless-stopped
    ports:
      - "127.0.0.1:8444:8444"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
