<!DOCTYPE html>
<html lang="it" translate="no" data-i18n-scope="web/display">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{assistant}}</title>
<link rel="stylesheet" href="/static/shared/nuxiva.css">
<link rel="stylesheet" href="/static/display/display.css">
<link rel="stylesheet" href="/static/display/hud.css">
<link rel="stylesheet" href="/static/display/widgets_hud.css">
<link rel="stylesheet" href="/static/display/widgets/live_brain_badge/badge.css">
<link rel="stylesheet" href="/static/display/desk_touch.css">
<link rel="stylesheet" href="/static/display/google.css">
<link rel="stylesheet" href="/static/display/vision.css">
<link rel="stylesheet" href="/static/display/mindstream.css">
<link rel="stylesheet" href="/static/display/presentation.css">
<link rel="stylesheet" href="/static/display/camera.css">
<link rel="stylesheet" href="/static/display/flow.css">
<link rel="stylesheet" href="/static/shared/bgqueue.css">
<link rel="stylesheet" href="/static/display/dock.css">
<link rel="stylesheet" href="/static/display/captions.css">
<link rel="stylesheet" href="/static/display/weather.css">
<link rel="stylesheet" href="/static/display/rail.css">
<link rel="stylesheet" href="/static/display/immersive.css">
</head>
<body class="holo-grid face">
<canvas id="core"></canvas>
<canvas id="scene"></canvas>

<div class="hud">
  <header>
    <div>
      <div class="brand"><span id="brand-name">{{assistant}}</span><small data-i18n="brand_sub"></small></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
  </header>

  <div class="presence" id="presence"></div>
  <div class="ear off" id="ear"><span class="bars" id="ear-bars"></span><span id="ear-text" data-i18n="ear_off"></span></div>
  <div class="desk" id="desk"></div>
  <div class="caption">
    <div class="you" id="you"></div>
    <div class="say" id="say"><span class="greet" id="greet"></span></div>
  </div>

  <div class="focus-say" id="focus-say"></div>
  <section class="stage" id="stage">
    <div class="stage-head"><h2 id="stage-title"></h2><p id="stage-sub"></p></div>
    <div class="stage-body" id="stage-body"></div>
  </section>

  <div class="project-widget" id="project-widget" style="display:none; position:absolute; right:20px; top:80px; background:rgba(0,10,20,0.8); border:1px solid var(--cyan); border-radius:12px; padding:12px; width:220px; z-index:100; cursor:pointer; backdrop-filter:blur(8px); transition:all 0.3s;">
    <div style="font-size:12px; color:var(--cyan); margin-bottom:6px; font-weight:bold; display:flex; justify-content:space-between;">
       <span data-i18n="project_working"></span>
       <span id="proj-pct">0%</span>
    </div>
    <div style="font-size:11px; color:#aaa; margin-bottom:8px;" id="proj-name"></div>
    <div style="width:100%; height:4px; background:#111; border-radius:2px; overflow:hidden;">
       <div id="proj-bar" style="width:0%; height:100%; background:var(--cyan); transition:width 0.5s;"></div>
    </div>
  </div>

  <div class="brain-ui">
    <div class="back"><button class="pill-btn" id="back-face" data-i18n="back_to_face"></button></div>
    <div class="panel legend" id="legend"></div>
    <div class="panel inspector" id="inspector"></div>
  </div>

  <div class="flow-ui" id="flow-ui">
    <div class="flow-back"><button class="pill-btn" id="flow-back" data-i18n="back_to_face"></button></div>
    <div class="flow-title">
      <h2 data-i18n="flow_title"></h2>
      <p data-i18n="flow_sub"></p>
    </div>
    <div class="flow-tabs" id="flow-tabs"></div>
    <div class="flow-canvas">
      <div class="flow-stage" id="flow-stage"></div>
    </div>
    <div class="flow-detail" id="flow-detail"></div>
    <div class="flow-bar" id="flow-bar"></div>
  </div>



  <div class="dock" role="toolbar" data-i18n-attr="aria-label:dock_label">
    <div class="dock-bar">
      <input id="in" data-i18n-attr="placeholder:input_placeholder,aria-label:input_placeholder" data-i18n-params='{"assistant":"{{assistant}}"}' autocomplete="off">
      <button class="dock-send" id="btn-send" type="button" disabled data-i18n-attr="title:btn_send,aria-label:btn_send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg></button>
      <button class="ibtn mic off" id="btn-mic" data-i18n-attr="title:btn_mic,aria-label:btn_mic" data-i18n-params='{"assistant":"{{assistant}}"}'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <button class="ibtn dock-more" id="btn-tools" type="button" aria-expanded="false" aria-controls="dock-tools" data-i18n-attr="title:btn_tools,aria-label:btn_tools"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    <div class="dock-tools" id="dock-tools">
      <button class="ibtn" id="btn-brain" data-i18n-attr="title:btn_brain,aria-label:btn_brain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 5 2V4.5A2.5 2.5 0 0 0 9 4zm6 0a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-5 2V4.5A2.5 2.5 0 0 1 15 4z"/></svg></button>
      <button class="ibtn" id="btn-flow" data-i18n-attr="title:btn_flow,aria-label:btn_flow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4" cy="12" r="2.5"/><circle cx="12" cy="5" r="2.5"/><circle cx="12" cy="19" r="2.5"/><circle cx="20" cy="12" r="2.5"/><path d="M6.5 12h3M12 7.5v9M14.5 12h3M6 10.5l4-4M6 13.5l4 4M14 6.5l4 4M14 17.5l4-4"/></svg></button>
      <button class="ibtn" id="btn-vol" data-i18n-attr="title:btn_audio,aria-label:btn_audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <button class="ibtn" id="btn-voice" data-i18n-attr="title:btn_voice,aria-label:btn_voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    </div>
  </div>
  <div class="dock-note" id="note"></div>
  <div class="panel vol-panel" id="vol-panel">
    <div class="panel-title" data-i18n="audio_title"></div>
    <div class="vol-row"><div class="top"><span><span data-i18n="speakers"></span> <b class="mono" id="vol-out-v">—</b></span><button class="mute" id="vol-out-m" data-i18n="mute"></button></div>
      <input type="range" id="vol-out" min="0" max="150" step="1" data-i18n-attr="aria-label:speakers"><select id="vol-out-d"></select></div>
    <div class="vol-row"><div class="top"><span><span data-i18n="microphone"></span> <b class="mono" id="vol-in-v">—</b></span><button class="mute" id="vol-in-m" data-i18n="mute"></button></div>
      <input type="range" id="vol-in" min="0" max="150" step="1" data-i18n-attr="aria-label:microphone"><div class="meter"><i id="vol-in-meter"></i></div><select id="vol-in-d"></select></div>
    <div class="faint" style="font-size:11px" id="vol-note" data-i18n="levels_live"></div>
    <div class="panel-title" style="margin-top:18px" data-i18n="look_title"></div>
    <div class="vol-row"><select id="avatar-pref">
        <option value="" data-i18n="look_system"></option>
        <option value="auto" data-i18n="look_auto"></option>
        <option value="full" data-i18n="look_full"></option>
        <option value="light" data-i18n="look_light"></option>
      </select><div class="why" id="avatar-why"></div></div>
  </div>
</div>

<div class="tooltip" id="tip"></div>
<div class="toast-mem" id="toast-mem"></div>
<div class="mind empty" id="mind" data-i18n-attr="title:mind_hint" data-i18n-params='{"assistant":"{{assistant}}"}'>
  <div class="mind-head"><span class="mind-dot"></span><span class="mind-who" id="mind-who"></span><span class="mind-time" id="mind-time"></span></div>
  <div class="mind-model" id="mind-model"></div>
  <div class="mind-line" id="mind-line"></div>
  <div class="mind-more" id="mind-more"></div>
</div>
<div class="banner" id="banner"></div>
<div class="listen-overlay"><div class="wave" id="listen-wave"></div><div class="label" id="listen-label"></div></div>
<div class="welcome" id="welcome"><b id="welcome-name"></b><span id="welcome-sub"></span></div>
<div class="link-lost" id="link"><div class="spinner"></div><span data-i18n="link_lost"></span></div>

<script src="/static/shared/core.js"></script>
<script src="/static/display/perf.js"></script>
<script src="/static/display/governor.js"></script>
<script src="/static/display/avatar.js"></script>
<script src="/static/display/hud_icons.js"></script>
<script src="/static/display/desk.js"></script>
<script src="/static/display/desk_touch.js"></script>
<script src="/static/display/state.js"></script>
<script src="/static/display/weather_icons.js"></script>
<script src="/static/display/weather_charts.js"></script>
<script src="/static/display/weather.js"></script>
<script src="/static/display/stage.js"></script>
<script src="/static/display/stage_google.js"></script>
<script src="/static/display/stage_vision.js"></script>
<script src="/static/display/voice.js"></script>
<script src="/static/display/captions.js"></script>
<script src="/static/display/ear.js"></script>
<script src="/static/display/hands_gesture.js"></script>
<script src="/static/display/hands.js"></script>
<script src="/static/display/look.js"></script>
<script src="/static/display/brain.js"></script>
<script src="/static/display/mindstream.js"></script>
<script src="/static/display/flow.js"></script>
<script src="/static/display/camera.js"></script>
<script src="/static/display/audio_panel.js"></script>
<script src="/static/display/enroll.js"></script>
<script src="/static/display/person_lang.js"></script>
<script src="/static/display/mood.js"></script>
<script src="/static/display/ambient.js"></script>
<script src="/static/display/rail.js"></script>
<script src="/static/display/chat.js"></script>
<script src="/static/display/widgets/live_brain_badge/badge.js"></script>
<script src="/static/display/musicout.js"></script>
<script src="/static/display/ducking.js"></script>
<script src="/static/shared/sfx.js"></script>
<script src="/static/display/sounds.js"></script>
<script src="/static/display/display.js"></script>
<script src="/static/shared/bgqueue.js"></script>
<script src="/static/shared/setup_prompt.js"></script>
</body>
</html>
