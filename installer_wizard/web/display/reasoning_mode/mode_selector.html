<div class="reasoning-selector-root" id="reasoning-selector-root" role="group" aria-label="Reasoning Mode">

      <span class="mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
