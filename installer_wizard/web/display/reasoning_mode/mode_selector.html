<div class="dock-model-selector" id="reasoning-selector-root">
  <button type="button" class="dock-model-trigger" id="btn-model-trigger" aria-haspopup="true" aria-expanded="false" title="Cambia versione motore cognitivo">
    <span class="dock-model-icon" id="dock-model-icon">✨</span>
    <span class="dock-model-text" id="dock-model-text">
      <span class="dock-model-name" id="dock-model-name">Auto</span>
      <span class="dock-model-badge" id="dock-model-ver-text">6.5-auto</span>
    </span>
    <svg class="dock-model-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <div class="dock-model-menu" id="dock-model-menu" role="menu" hidden>
    <div class="dock-model-menu-head">
      <span class="menu-head-title">MOTORI COGNITIVI</span>
      <span class="menu-head-count" id="dock-model-count">6 VERSIONI</span>
    </div>
    <div class="dock-model-items" id="dock-model-items"></div>
  </div>
</div>
