<!DOCTYPE html>
<html lang="it" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title data-i18n="app-title"></title>
<link rel="stylesheet" href="/static/shared/nuxiva.css">
<link rel="stylesheet" href="/static/setup/setup_base.css">
<link rel="stylesheet" href="/static/setup/setup_layout.css">
<link rel="stylesheet" href="/static/setup/setup_screens.css">
</head>
<body class="holo-hud-body">
<div class="hud-stars-bg" aria-hidden="true"></div>

<div class="hud-app" id="hud-app">
  <header class="hud-top-bar" id="hud-top">
    <div class="hud-brand">
      <span class="hud-pulse-ring"></span>
      <b class="hud-logo-text" id="hud-brand-text">NUXIVA</b>
      <span class="hud-sub-badge">OS 6.5</span>
    </div>

    <nav class="hud-stepper" id="hud-stepper">
      <ol class="stepper-nodes" id="stepper-track"></ol>
    </nav>

    <div class="hud-top-telemetry">
      <div class="hud-tele-pill" id="conn-pill">
        <span class="tele-dot online"></span>
        <span class="tele-txt" data-i18n="conn-online"></span>
      </div>
      <div class="hud-tele-pill">
        <span class="tele-label" data-i18n="latency-label"></span>
        <b class="tele-val" id="tele-ping">12 ms</b>
      </div>
      <div class="hud-lang-picker" id="hud-lang-picker">
        <button type="button" class="lang-pill active" data-lang="it">IT</button>
        <button type="button" class="lang-pill" data-lang="en">EN</button>
        <button type="button" class="lang-pill" data-lang="es">ES</button>
        <button type="button" class="lang-pill" data-lang="fr">FR</button>
      </div>
    </div>
  </header>

  <div class="hud-main-grid" id="hud-main">
    <aside class="hud-quadrant quadrant-left" id="quad-left">
      <div class="q-card q-guide">
        <div class="hud-sec-badge" id="guide-badge"></div>
        <h1 class="hud-title" id="guide-title"></h1>
        <p class="hud-lead" id="guide-desc"></p>
        
        <div class="hud-checklist-wrap">
          <span class="chk-hdr" data-i18n="chk-hdr-status"></span>
          <ul class="hud-checklist" id="guide-checklist"></ul>
        </div>

        <div class="hud-security-seal">
          <span class="seal-icon">🛡️</span>
          <div class="seal-meta">
            <b data-i18n="seal-subsystem-title"></b>
            <small data-i18n="seal-security-desc"></small>
          </div>
        </div>
      </div>
    </aside>

    <main class="hud-quadrant quadrant-center" id="quad-center">
      <div class="stage-screen" data-step="1" id="screen-1">
        <div class="world-map-holo" id="map-holo">
          <div class="map-grid-lines"></div>
          <div class="tz-ping" id="tz-ping" style="top:38%; left:52%;">
            <span class="ping-circle"></span>
            <span class="tz-label" id="lbl-detected-tz"></span>
          </div>
        </div>
        <div class="lang-matrix-grid" id="lang-cards"></div>
      </div>

      <div class="stage-screen" data-step="2" id="screen-2" hidden>
        <div class="hud-banner-alert" id="banner-mic">
          <span class="banner-icon">⚠️</span>
          <div>
            <b data-i18n="banner-mic-alert"></b>
            <p data-i18n="banner-mic-desc"></p>
          </div>
        </div>
        <div class="canvas-viewport">
          <canvas id="canvas-oscilloscope" width="620" height="220"></canvas>
        </div>
        <div class="mic-stage-controls">
          <button type="button" class="hud-btn-primary glow" id="btn-start-mic-cal">
            <span class="btn-dot"></span>
            <span data-i18n="btn-start-mic"></span>
          </button>
          <div class="mic-phase-status" id="mic-phase-msg"></div>
        </div>
      </div>

      <div class="stage-screen" data-step="3" id="screen-3" hidden>
        <div class="orbit-header">
          <span class="orbit-badge" id="orbit-assistant-title"></span>
        </div>
        <div class="naming-input-group">
          <label class="hud-input-label" data-i18n="lbl-assist-name"></label>
          <div class="name-chips" id="quick-name-chips"></div>
          <input type="text" class="hud-text-input" id="input-assistant-name" maxlength="32" autocomplete="off">
        </div>
        <div class="voice-timbre-picker">
          <div class="voice-cards-row" id="voice-cards"></div>
          <button type="button" class="hud-btn-ghost" id="btn-voice-preview">
            <span>🔊</span>
            <span data-i18n="lbl-voice-preview"></span>
          </button>
        </div>
        <div class="wake-rings-chamber">
          <div class="rings-row">
            <div class="chamber-ring" id="ring-1" data-shot="1"><span class="r-num">1</span><small data-i18n="lbl-shot-natural"></small></div>
            <div class="chamber-ring" id="ring-2" data-shot="2"><span class="r-num">2</span><small data-i18n="lbl-shot-casual"></small></div>
            <div class="chamber-ring" id="ring-3" data-shot="3"><span class="r-num">3</span><small data-i18n="lbl-shot-distant"></small></div>
          </div>
          <div class="ring-prompt-banner" id="ring-prompt-txt"></div>
        </div>
      </div>

      <div class="stage-screen" data-step="4" id="screen-4" hidden>
        <div class="bio-split-stage">
          <div class="bio-col">
            <span class="split-tag" data-i18n="tag-voice-dna"></span>
            <canvas id="canvas-voiceprint" width="280" height="200"></canvas>
            <div class="owner-inputs">
              <input type="text" class="hud-text-input" id="owner-first-input" data-i18n-ph="lbl-owner-name">
              <input type="text" class="hud-text-input" id="owner-last-input" data-i18n-ph="lbl-owner-last">
            </div>
          </div>
          <div class="bio-col">
            <span class="split-tag" data-i18n="tag-face-scanner"></span>
            <div class="face-viewfinder">
              <div class="reticle-box"></div>
              <span class="viewfinder-scan-line"></span>
              <span class="viewfinder-status" id="face-liveness-val"></span>
            </div>
            <button type="button" class="hud-btn-ghost" id="btn-trigger-face" data-i18n="btn-scan-face"></button>
          </div>
        </div>
      </div>

      <div class="stage-screen" data-step="5" id="screen-5" hidden>
        <div class="optical-radar-top">
          <div class="radar-circle">
            <span class="radar-sweep-arm"></span>
            <span class="radar-core-blip"></span>
          </div>
          <div class="radar-text-info">
            <b data-i18n="lbl-cam-scan"></b>
            <small id="cams-count-text"></small>
          </div>
        </div>
        <div class="cam-matrix-grid" id="cam-matrix"></div>
      </div>

      <div class="stage-screen" data-step="6" id="screen-6" hidden>
        <div class="neural-graph-stage">
          <canvas id="canvas-neural-graph" width="600" height="180"></canvas>
        </div>
        <div class="brain-presets-grid" id="brain-presets"></div>
        <div class="ha-bridge-card">
          <div class="ha-header">
            <span data-i18n="ha-bridge-title"></span>
            <span class="ha-status-badge" id="ha-status" data-i18n="ha-status-auto"></span>
          </div>
          <div class="ha-inputs">
            <input type="text" class="hud-text-input" id="ha-url-in" placeholder="http://homeassistant.local:8123">
            <input type="password" class="hud-text-input" id="ha-token-in" data-i18n-ph="lbl-ha-token">
          </div>
        </div>
      </div>

      <div class="stage-screen" data-step="7" id="screen-7" hidden>
        <div class="readiness-matrix-grid" id="matrix-summary"></div>
        <div class="final-launch-zone">
          <button type="button" class="hud-btn-launch" id="btn-final-launch">
            <span class="launch-halo"></span>
            <b id="launch-btn-label"></b>
          </button>
          <div class="synaptic-test-bars" id="selftest-bars"></div>
        </div>
      </div>
    </main>

    <aside class="hud-quadrant quadrant-right" id="quad-right">
      <div class="q-card q-analytics">
        <div class="hud-sec-badge" data-i18n="analytics-title"></div>
        <div class="analytics-metrics-list" id="analytics-list"></div>
        <div class="streaming-synapse-log" id="synapse-log-box">
          <span class="log-title" data-i18n="synapse-log-title"></span>
          <pre class="log-pre" id="synapse-log-stream"></pre>
        </div>
      </div>
    </aside>
  </div>

  <footer class="hud-bottom-bar" id="hud-bottom">
    <div class="bar-col left">
      <button type="button" class="hud-nav-btn secondary" id="btn-back" data-i18n="btn-back"></button>
    </div>
    <div class="bar-col center">
      <div class="status-indicator-bar" id="bottom-status-wrap">
        <span class="status-bullet"></span>
        <span class="status-msg" id="bottom-status-msg" data-i18n="lbl-status-ready"></span>
      </div>
      <button type="button" class="hud-nav-btn small ghost" id="btn-recalibrate" data-i18n="btn-recalibrate"></button>
    </div>
    <div class="bar-col right">
      <button type="button" class="hud-nav-btn primary glow" id="btn-next" data-i18n="btn-next"></button>
    </div>
  </footer>
</div>

<script src="/static/setup/language/dict_it.js"></script>
<script src="/static/setup/language/dict_en.js"></script>
<script src="/static/setup/language/dict_es.js"></script>
<script src="/static/setup/language/dict_fr.js"></script>
<script src="/static/setup/language/setup_i18n.js"></script>
<script src="/static/setup/setup_canvas.js"></script>
<script src="/static/setup/setup_steps.js"></script>
<script src="/static/setup/setup.js"></script>
</body>
</html>
