<section class="tab" id="tab-cameras" data-i18n-scope="features/cameras">
  <div class="panel cam-privacy">
    <div class="panel-title cam-privacy-title"><span aria-hidden="true">⚠</span><span data-i18n="privacy.title"></span></div>
    <div class="muted-note cam-privacy-body">
      <span data-i18n="privacy.body"></span>
      <strong data-i18n="privacy.analysis"></strong>
    </div>
  </div>
  <div class="cam-tabs" id="cam-tabs" role="toolbar" data-i18n-attr="aria-label:a11y.tabs">
    <button type="button" class="btn sm primary" data-pane="live" data-i18n="tabs.live"></button>
    <button type="button" class="btn sm" data-pane="add" data-i18n="tabs.add"></button>
    <button type="button" class="btn sm" data-pane="archive" data-i18n="tabs.archive"></button>
    <button type="button" class="btn sm" data-pane="events" data-i18n="tabs.events"></button>
    <button type="button" class="btn sm" data-pane="devices" data-i18n="tabs.devices"></button>
  </div>
  <div id="cam-status" class="muted-note" role="status" aria-live="polite"></div>
  <div class="cam-pane" id="cam-pane-live"></div>
  <div class="cam-pane" id="cam-pane-add" hidden></div>
  <div class="cam-pane" id="cam-pane-archive" hidden></div>
  <div class="cam-pane" id="cam-pane-events" hidden></div>
  <div class="cam-pane" id="cam-pane-devices" hidden></div>
  <div class="cam-drawer" id="cam-drawer" hidden></div>
  <div class="cam-lightbox" id="cam-lightbox" hidden></div>
</section>
