name: Nuxiva
options:
  bundleIdPrefix: com.nuxiva
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "5.8.16"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ENABLE_MODULES: YES
targets:
  Nuxiva:
    type: application
    platform: iOS
    sources:
      - path: Nuxiva
      - path: Core/Generated
        group: Core
    dependencies:
      - framework: Core/NuxivaCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuxiva.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Nuxiva/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        OTHER_LDFLAGS: ["-lc++"]
  NuxivaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NuxivaTests
      - path: ../contracts/android_enrollment.json
        buildPhase: resources
    dependencies:
      - target: Nuxiva
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nuxiva.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nuxiva.app/Nuxiva"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Nuxiva:
    build:
      targets:
        Nuxiva: all
        NuxivaTests: [test]
    test:
      targets:
        - NuxivaTests
