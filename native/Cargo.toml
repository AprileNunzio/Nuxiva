[workspace]
resolver = "3"
members = ["crates/bus-core", "crates/nuxiva-native", "crates/egress", "crates/netguard", "crates/langid", "crates/crdt-core", "crates/spatial-core", "crates/audio-dsp", "crates/cortex-core", "crates/stage-core", "crates/vitals-core", "crates/satellite-core", "crates/gesture-core", "crates/token-core", "crates/agency-domain", "crates/agency-planner", "crates/agency-ledger", "crates/agency-scheduler", "crates/agency-daemon", "crates/agency-codeindex", "crates/agency-thought", "crates/agency-action", "crates/agency-forge", "crates/admin-os", "crates/display-domain", "crates/display-stream", "crates/display-scheduler", "crates/display-daemon", "crates/presence-core", "crates/update-core", "crates/access-core", "crates/display-planner", "crates/display-learner", "crates/display-wasm", "crates/sentinel-core", "crates/surface-core", "crates/molecule-core", "crates/agency-foresight", "crates/guard-core", "crates/seal-core", "crates/config-core", "crates/telemetry-core", "crates/supervisor-core", "crates/authz-core", "crates/ear-core", "crates/face-core", "crates/dialog-core", "crates/rescue-core", "crates/expr-core", "crates/memory-core", "crates/vault-media", "crates/ask-core", "crates/gait-core", "crates/matter-core", "crates/agent-core", "crates/dossier-core", "crates/forma-core", "crates/creations-core", "crates/nvr-core", "crates/mastery-core", "crates/defense-core", "crates/lyrics-core", "crates/weather-core", "crates/vision-core", "crates/resource-core", "crates/mcp-core", "crates/mcp-servers"]

[workspace.package]
version = "5.8.0"
edition = "2024"
rust-version = "1.99.1"
license = "Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
assert_is_empty = "allow"
collapsible_if = "allow"
chunks_exact_to_as_chunks = "allow"
approx_constant = "allow"
manual_is_multiple_of = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
overflow-checks = true

[profile.device]
inherits = "release"
lto = "thin"
codegen-units = 16
