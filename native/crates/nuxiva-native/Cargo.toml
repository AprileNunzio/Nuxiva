nuxiva-forma-core = { path = "../forma-core" }
nuxiva-creations-core = { path = "../creations-core" }
nuxiva-mastery-core = { path = "../mastery-core" }
nuxiva-weather-core = { path = "../weather-core" }
agency-codeindex = { path = "../agency-codeindex" }
agency-forge = { path = "../agency-forge" }
agency-scheduler = { path = "../agency-scheduler" }
agency-thought = { path = "../agency-thought" }
nuxiva-admin-os = { path = "../admin-os" }
nuxiva-audio-dsp = { path = "../audio-dsp" }
nuxiva-bus-core = { path = "../bus-core" }
