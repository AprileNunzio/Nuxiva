nuxiva-authz-core = { path = "../authz-core" }
nuxiva-ear-core = { path = "../ear-core" }
nuxiva-lyrics-core = { path = "../lyrics-core" }
nuxiva-face-core = { path = "../face-core" }
nuxiva-dialog-core = { path = "../dialog-core" }
nuxiva-rescue-core = { path = "../rescue-core" }
nuxiva-defense-core = { path = "../defense-core" }
nuxiva-resource-core = { path = "../resource-core" }
nuxiva-expr-core = { path = "../expr-core" }
nuxiva-memory-core = { path = "../memory-core" }
nuxiva-vault-media = { path = "../vault-media" }
nuxiva-nvr-core = { path = "../nvr-core" }
nuxiva-vision-core = { path = "../vision-core" }
nuxiva-mcp-core = { path = "../mcp-core" }
nuxiva-mcp-servers = { path = "../mcp-servers" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
nuxiva-ask-core = { path = "../ask-core" }
nuxiva-gait-core = { path = "../gait-core" }
nuxiva-matter-core = { path = "../matter-core" }
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
ed25519-dalek = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[features]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
