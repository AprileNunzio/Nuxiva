[package]
name = "nuxiva-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nuxiva_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
agency-action = { path = "../agency-action" }
nuxiva-agent-core = { path = "../agent-core" }
nuxiva-dossier-core = { path = "../dossier-core" }
nuxiva-context-core = { path = "../context-core" }
nuxiva-percept-core = { path = "../percept-core" }
nuxiva-swarm-core = { path = "../swarm-core" }
