[package]
name = "nuxiva-display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nuxiva_display"
path = "src/lib.rs"

[[bin]]
name = "nuxiva-display"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nuxiva-display-scheduler = { path = "../display-scheduler" }
nuxiva-display-stream = { path = "../display-stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
