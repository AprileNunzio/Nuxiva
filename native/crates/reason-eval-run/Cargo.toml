[package]
name = "nuxiva-reason-eval-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nuxiva-reason-eval-run"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nuxiva-reason-eval = { path = "../reason-eval" }
nuxiva-reason-understand = { path = "../reason-understand" }
nuxiva-reason-lab = { path = "../reason-lab" }
nuxiva-llm-client = { path = "../llm-client" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
