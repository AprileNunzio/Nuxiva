[package]
name = "nuxiva-display-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
nuxiva-gesture-core = { path = "../gesture-core" }
