name: Windows Assistant

on:
  pull_request:
    paths:
      - "client_satellite/windows_assistant/**"
      - ".github/workflows/windows-assistant.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  assistant:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client_satellite/windows_assistant
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: client_satellite/windows_assistant/requirements-dev.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Static Analysis
        run: python -m pyflakes .

      - name: Client Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        env:
          NUXIVA_ASSISTANT_SIGNING_KEY: ${{ secrets.NUXIVA_ASSISTANT_SIGNING_KEY }}
        run: .\packaging\build.ps1

      - name: Installer With Appended Enrollment Block
        run: python packaging\verify_trailer.py build\installer\Nuxiva_Setup.exe

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Nuxiva_Setup
          path: |
            client_satellite/windows_assistant/build/installer/Nuxiva_Setup.exe
            client_satellite/windows_assistant/build/installer/manifest.json
            client_satellite/windows_assistant/build/installer/manifest.sig
          if-no-files-found: error
          retention-days: 30
