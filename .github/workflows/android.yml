name: Android Node

on:
  pull_request:
    paths:
      - "client_apk/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client_apk
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust 1.99.1 With Android Targets
        working-directory: native
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4

      - name: Build Wake Word Library
        run: sh ../scripts/android/build_wakeword.sh

      - name: Logic Tests
        run: ./gradlew --no-daemon :logic:test

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Signing Key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.NUXIVA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUXIVA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUXIVA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUXIVA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/nuxiva-release.p12"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
            store_pass="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_pass="$KEY_PASSWORD"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android signing secrets are missing: using a temporary key. The APK installs, but a later build cannot update it in place."
            store_pass=$(openssl rand -hex 24)
            key_alias=nuxiva
            key_pass="$store_pass"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass "$store_pass" -keypass "$key_pass" \
              -alias "$key_alias" -keyalg RSA -keysize 4096 -validity 9125 -dname "CN=Nuxiva,O=Nuxiva"
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$store_pass"
          echo "::add-mask::$key_pass"
          {
            echo "NUXIVA_KEYSTORE_PATH=$keystore"
            echo "NUXIVA_KEYSTORE_PASSWORD=$store_pass"
            echo "NUXIVA_KEY_ALIAS=$key_alias"
            echo "NUXIVA_KEY_PASSWORD=$key_pass"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify Signature
        id: apk
        run: |
          set -euo pipefail
          built=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/apksigner" verify --verbose --print-certs "$built"
          "$tools/zipalign" -c -P 16 4 "$built" || "$tools/zipalign" -c 4 "$built"
          mkdir -p build/release
          cp "$built" build/release/Nuxiva.apk
          sha256sum build/release/Nuxiva.apk | cut -d' ' -f1 > build/release/Nuxiva.apk.sha256
          echo "sha256=$(cat build/release/Nuxiva.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuxiva
          path: |
            client_apk/build/release/Nuxiva.apk
            client_apk/build/release/Nuxiva.apk.sha256
          if-no-files-found: error
          retention-days: 30
