version: '3.8'

services:
  nuxiva:
    build: .
    container_name: nuxiva_core
    restart: unless-stopped
    ports:
      - "80:80"       # Frontend Ologramma
      - "8080:8080"   # Pannello di Controllo / Admin
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - NUXIVA_ENV=production
      - NUXIVA_HOST=0.0.0.0
      - NUXIVA_PORT=80
      - NUXIVA_DB_URL=postgresql://nuxiva:secret@postgres:5432/nuxiva
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: nuxiva_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: nuxiva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nuxiva
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nuxiva
    volumes:
      - pgdata:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nuxiva_jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC

volumes:
  pgdata:
