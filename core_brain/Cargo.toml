[package]
name = "nuxiva-core-brain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
workspace = "../native"

[lib]
name = "core_brain"
path = "src/lib.rs"

[[bin]]
name = "core_brain"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nuxiva-context-core = { path = "../native/crates/context-core" }
nuxiva-ear-core = { path = "../native/crates/ear-core" }
nuxiva-swarm-core = { path = "../native/crates/swarm-core" }
nuxiva-agent-core = { path = "../native/crates/agent-core" }
serde_json = "1"

nuxiva-mcp-core = { path = "../native/crates/mcp-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "fs"] }
tract-onnx = "0.23"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
hex = "0.4"
realfft = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
